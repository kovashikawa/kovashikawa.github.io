<div class="masthead">
  <div class="masthead__inner-wrap">
    <nav class="masthead__menu masthead-quiet" aria-label="Site">
      <a class="masthead-quiet__item" href="{{ '/about/' | relative_url }}">
        <span class="masthead-quiet__label">{{ site.title }}</span>
        <span class="masthead-quiet__sub">(about me)</span>
      </a>
      <div class="masthead-quiet__right">
        <a class="masthead-quiet__item" href="{{ '/' | relative_url }}">
          <span class="masthead-quiet__label">Home</span>
          <span class="masthead-quiet__sub">(posts and projects)</span>
        </a>
        <button class="lc-toggle" type="button" aria-pressed="false" aria-label="Toggle lowercase" title="Toggle lowercase"><span class="lc-a">a</span>/<span class="lc-A">A</span></button>
        <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Toggle dark mode" title="Toggle dark mode"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path class="theme-toggle__fill" d="M8 1.75a6.25 6.25 0 0 1 0 12.5z"/></svg></button>
      </div>
    </nav>
  </div>
</div>
<script>
(function () {
  var tbtn = document.querySelector('.theme-toggle');
  if (tbtn) {
    var root = document.documentElement;
    var sync = function () {
      tbtn.setAttribute('aria-pressed', root.getAttribute('data-theme') === 'dark' ? 'true' : 'false');
    };
    sync();
    tbtn.addEventListener('click', function () {
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      sync();
      try { localStorage.setItem('theme', next); } catch (e) {}
    });
  }
})();
(function () {
  var btn = document.querySelector('.lc-toggle');
  if (!btn) return;
  function set(on) {
    document.body.classList.toggle('lc', on);
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    try { localStorage.setItem('lc', on ? '1' : '0'); } catch (e) {}
  }
  try { if (localStorage.getItem('lc') === '1') set(true); } catch (e) {}
  btn.addEventListener('click', function () {
    set(!document.body.classList.contains('lc'));
  });
})();
</script>
